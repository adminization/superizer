[versions]
kotlin = "2.4.10"
composeMultiplatform = "1.11.1"
agp = "8.13.2"
composeUnstyled = "1.36.1"
androidxActivityCompose = "1.13.0"
androidxLifecycle = "2.10.0"
# The lock's sheet (06): BiometricPrompt, and the FragmentActivity it has to be shown from. 1.1.0 is
# the last stable biometric; fragment is named so a host gets a current one rather than the 1.2.5
# biometric was built against.
androidxBiometric = "1.1.0"
androidxFragment = "1.8.9"
androidCompileSdk = "36"
androidMinSdk = "24"
androidTargetSdk = "36"
kotlinxCoroutines = "1.10.2"
kotlinxSerializationJson = "1.9.0"
ktor = "3.4.0"
kotlinxBrowser = "0.5.0"

# Firebase Cloud Messaging, which is what fills the Android push seam (13 §8). The BOM is the only
# version anybody sets: every firebase-* artifact takes its version from it, and a hand-pinned
# messaging version is how two Firebase libraries end up compiled against different internals.
firebaseBom = "34.19.0"

[libraries]
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-ui-test = { module = "org.jetbrains.compose.ui:ui-test", version.ref = "composeMultiplatform" }
compose-unstyled = { module = "com.composables:core", version.ref = "composeUnstyled" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivityCompose" }
androidx-lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "androidxLifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime", version.ref = "androidxLifecycle" }
androidx-biometric = { module = "androidx.biometric:biometric", version.ref = "androidxBiometric" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "androidxFragment" }

kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
# `kotlinx.browser` left the stdlib in Kotlin 2.x; a module that touches localStorage or the window
# has to ask for it now. Compose brings it transitively, and `host` deliberately does not use Compose.
kotlinx-browser = { module = "org.jetbrains.kotlinx:kotlinx-browser", version.ref = "kotlinxBrowser" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
# NSURLSession, which is what an iOS app is expected to use: it honours the system proxy, App
# Transport Security and the per-app VPN, and none of the other engines runs on Kotlin/Native iOS.
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
# No version: the BOM above supplies it.
firebase-messaging = { module = "com.google.firebase:firebase-messaging" }

# Referenced by the convention plugins through the `libs` accessor of build-logic's own catalog.
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradle-plugin = { module = "org.jetbrains.compose:compose-gradle-plugin", version.ref = "composeMultiplatform" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

# The docs, as a website, built by the Jekyll that GitHub Pages already has.
#
# No generator and no theme of our own: `docs/` is plain markdown that has to read correctly in a
# checkout, on github.com and here, and a build step that could change what it says would be a
# fourth place for the documentation to be wrong. See docs/_config.yml for the four plugins that
# make the same link work in all three.
name: pages

on:
  push:
    branches: [main, master]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancelled halfway: a half-published site is worse than an
# old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

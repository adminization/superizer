# The branch decides the channel; the registry decides the number.
#
#   main, master -> 0.1.1                   the release, the previous one patch bumped
#   next         -> 0.1.1-next.3            a prerelease series
#   alpha        -> 0.1.1-alpha.0           another, on its own counter
#   commit       -> 0.1.0-commit.d66035c    one build, named after the commit that is in it
#
# This is Adminizer's scheme, ported to Maven. Nobody edits a version to cut a release and no tag
# has to agree with a file: `superizer.version` in `gradle.properties` is a floor, raised by hand
# to start a new series, and `scripts/resolve-version.sh` asks the registry for the rest. The
# script is the whole of the logic and runs the same on a laptop — see its header.
name: publish

on:
  push:
    branches: [main, master, next, alpha, commit]
  workflow_dispatch:

# Two pushes resolving a version at the same time would both read the same registry state and
# both try to publish it; the loser gets a 409 rather than a merge.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # `packages: ''` because the action's default is the `tools` package, which the SDK
      # repository no longer has — it fails with "Failed to find package 'tools'" and takes
      # the job with it. AGP only needs a licensed SDK, and the runner image already has one.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # The library and the bench app are resolved separately: apps version themselves (02), so
      # `test-app` has its own floor and its own counter and must not inherit the library's.
      - name: Resolve the version
        id: version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SUPERIZER_GITHUB_SLUG: ${{ github.repository }}
        run: |
          set -euo pipefail
          case "$GITHUB_REF_NAME" in
            main|master) channel=release ;;
            next)        channel=next    ;;
            alpha)       channel=alpha   ;;
            commit)      channel=commit  ;;
            *) echo "::error::$GITHUB_REF_NAME has no channel"; exit 1 ;;
          esac
          sha=$(git rev-parse --short HEAD)
          floor=$(sed -n 's/^superizer\.version=//p' gradle.properties)
          appsFloor=$(sed -n 's/^superizer\.appsVersion=//p' gradle.properties)

          library=$(./scripts/resolve-version.sh "$channel" cx/m42/superizer/core "$floor" "$sha")
          apps=$(./scripts/resolve-version.sh "$channel" cx/m42/superizer/apps/test-app "$appsFloor" "$sha")

          echo "channel=$channel" >> "$GITHUB_OUTPUT"
          echo "library=$library" >> "$GITHUB_OUTPUT"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "args=-Psuperizer.version=$library -Psuperizer.appsVersion=$apps" >> "$GITHUB_OUTPUT"

      # Two invocations rather than `./gradlew verify publish`. In one, nothing orders a publish
      # task after a test task — they have no dependency between them, and with --parallel an
      # upload can finish before the test that would have stopped it. A separate step cannot.
      - name: Verify
        run: ./gradlew verify ${{ steps.version.outputs.args }}

      - name: Publish ${{ steps.version.outputs.library }}
        run: ./gradlew publish ${{ steps.version.outputs.args }}
        env:
          ORG_GRADLE_PROJECT_GitHubPackagesUsername: ${{ github.actor }}
          ORG_GRADLE_PROJECT_GitHubPackagesPassword: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: success()
        run: |
          {
            echo "### Published on the \`${{ steps.version.outputs.channel }}\` channel"
            echo
            echo "| Coordinates | Version |"
            echo "|---|---|"
            echo "| \`cx.m42.superizer:{core,ui-theme,ui,host,testing}\` | \`${{ steps.version.outputs.library }}\` |"
            echo "| \`cx.m42.superizer.apps:test-app\` | \`${{ steps.version.outputs.apps }}\` |"
            echo
            echo "\`\`\`kotlin"
            echo "maven(\"https://maven.pkg.github.com/${{ github.repository }}\")"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: publish-test-results
          path: '**/build/test-results/**/*.xml'

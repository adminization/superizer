# One version for the whole library (02). Apps version themselves.
superizer.version=0.1.0
superizer.group=cx.m42.superizer

# MaxMetaspaceSize is the one that matters: the Compose compiler plugin and AGP between them load
# enough classes that the JVM's 512m default runs out part-way through a build.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true

# One version for the whole library (02). Apps version themselves, so the bench app has its own.
#
# Both are floors rather than decisions: CI resolves what actually gets published from what the
# registry already has (scripts/resolve-version.sh) and passes it back as -P. Raise one by hand to
# start a new series — a minor, a major — and it wins until the registry catches up.
superizer.version=0.3.0
superizer.appsVersion=1.0.0
superizer.group=cx.m42.superizer

# MaxMetaspaceSize is the one that matters: the Compose compiler plugin and AGP between them load
# enough classes that the JVM's 512m default runs out part-way through a build.
# Raised from 1g when `host` gained Firebase: firebase-messaging brings the Play Services
# graph with it, and AGP plus the Compose compiler plugin were already close to the old
# ceiling. The symptom is not a clear message but `java.lang.OutOfMemoryError: Metaspace`
# thrown from inside the Kotlin compiler, which reads like a compiler bug and is not one.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=2g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

kotlin.code.style=official

# iOS klibs compile on any host (Kotlin 2.4 cross-compiles Apple targets); running iOS tests and
# linking a framework need a Mac. On Linux those tasks are skipped rather than warned about on every
# build — verify.sh says so by name instead.
kotlin.native.ignoreDisabledTargets=true
kotlin.incremental=true
kotlin.daemon.jvmargs=-Xmx3g

android.useAndroidX=true
android.nonTransitiveRClass=true
